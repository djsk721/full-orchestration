name: Documentation quality

on:
  pull_request:
  push:
    paths:
      - "**.md"
      - "docs/**"
      - "docs-theme/**"
      - "scripts/docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.11.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.1"
      - name: Install pinned documentation tools
        run: |
          python -m pip install -r requirements-docs.txt
          npm ci --prefix scripts/docs --ignore-scripts
      - name: Validate sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run --prefix scripts/docs lint
          python scripts/docs/check_doc_structure.py
          python scripts/docs/check_translations.py
          if [[ -n "$BASE_SHA" ]]; then
            python scripts/docs/check_feature_consistency.py --base "$BASE_SHA"
          else
            python scripts/docs/check_feature_consistency.py
          fi
      - name: Build and verify both languages
        run: |
          python -m mkdocs build --strict
          python scripts/docs/check_doc_structure.py --site site
      - name: Upload verified static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-site
          path: site
          if-no-files-found: error
