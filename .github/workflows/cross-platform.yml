name: Cross-platform verification

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "orchestra/**"
      - "tests/**"
      - "scripts/qa/**"
      - "requirements-desktop.txt"
      - "package*.json"
      - "Build-Windows.ps1"
      - "ModelOrchestration.pyw"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.11.14"
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth tk libnss3 libgtk-3-0t64 libasound2t64 libgbm1
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: npm run verify -- --ui --package
      - name: Exercise the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qa/verify-windows-installer.ps1

  portable-without-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.1"
      - run: npm ci --ignore-scripts
      - run: npm run verify -- --core-only
